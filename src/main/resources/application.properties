server.port=8080
server.address=${SERVER_ADDRESS:127.0.0.1}
spring.data.mongodb.uri=${MONGODB_URI:mongodb://127.0.0.1:27017/automarket_fullstack}
spring.data.mongodb.auto-index-creation=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.persistAuthorization=false
app.jwt.secret=${JWT_SECRET}
app.jwt.minutes=15
app.refresh.days=7
app.cookie.secure=${COOKIE_SECURE:false}
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

server.forward-headers-strategy=framework
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# Solo para demostración
app.demo.enabled=${DEMO_DATA_ENABLED:false}
app.demo.customer.password=${DEMO_CUSTOMER_PASSWORD:}
